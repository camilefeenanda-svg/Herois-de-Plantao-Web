<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Heróis de Plantão</title><link rel="stylesheet" href="css/estilos.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#5B9CBF}.login{width:min(94vw,460px);background:#fff;border-radius:18px;padding:32px;box-shadow:0 15px 40px #24577733}.login h1{text-align:center;color:#376f90}.login p{text-align:center;color:#526574}.login label{display:block;margin:18px 0 5px;font-weight:700}.login input{width:100%;padding:13px;border:2px solid #97C8E2;border-radius:8px}.login button{margin-top:24px;width:100%;border:0;border-radius:8px;padding:14px;background:#5B9CBF;color:white;font-size:17px;cursor:pointer}.login a{color:#376f90}.login small{display:block;margin-top:17px;line-height:1.5}</style></head><body><main class="login"><h1>✚ Heróis de Plantão</h1><p>Acesso demonstrativo ao sistema hospitalar</p><form id="login"><label for="usuario">Usuário</label><input id="usuario" autocomplete="username" minlength="3" required placeholder="Informe um usuário fictício"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="off" minlength="4" required placeholder="Mínimo de 4 caracteres"><button type="submit">Entrar</button></form><small>Protótipo acadêmico: qualquer usuário fictício com pelo menos 3 caracteres e senha com pelo menos 4 caracteres pode entrar. Não use dados ou senhas reais. <a href="index.html">Ir ao menu principal</a>.</small></main><script src="js/login.js"></script></body></html>
